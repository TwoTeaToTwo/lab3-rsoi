openapi: 3.0.3
info:
  title: Flight Booking System — лабораторная работа №3, вариант 1
  version: 2.0.0
  description: |
    Контракт четырех сервисов. Публичная точка входа — Gateway (8080).
    Flight Service (8060), Ticket Service (8070) и Bonus Service (8050)
    предоставляют внутренние API только для вызовов Gateway; горизонтальные вызовы запрещены.
    Каждый сервис работает только со своей логической базой PostgreSQL. Gateway не имеет БД.
    При расхождениях требований задания и приемочных тестов приоритет имеют тесты v1 ЛР №3.
    Заголовок X-User-Name идентифицирует пользователя в рамках учебного задания;
    он не является механизмом аутентификации.

    Отказоустойчивость чтений:
    * Все исходящие чтения Gateway, в том числе внутри покупки и возврата, защищены Circuit Breaker.
      Flight, Ticket и Bonus имеют отдельные состояния и счетчики в памяти Gateway.
    * После N технических неудач подряд цепь открывается: следующий вызов не отправляется сервису.
      Успешное чтение сбрасывает счетчик; N и время ожидания настраиваются.
      После ожидания допускается один проверочный запрос (Half-open), остальные чтения сразу
      обрабатываются как недоступность. Успешная проверка закрывает цепь и сбрасывает счетчик;
      техническая ошибка снова открывает цепь и запускает ожидание заново.
    * Технические неудачи — HTTP 5xx, сетевые ошибки, таймауты и невалидные ответы сервиса.
      HTTP 4xx не считаются отказом доступности и не подменяются fallback.
      Внутренние HTTP-повторы чтений не выполняются: одна попытка учитывается один раз.
      Локальный отказ открытой цепи и возврат fallback не увеличивают счетчик.
    * Недоступность критичного источника возвращает ошибку; некритичного — частичный ответ 200.
      Открытый Circuit Breaker обрабатывается по тем же правилам, что и сетевой отказ.
    * Flight критичен для списка рейсов; Ticket — для списка билетов, отдельного билета и /me.
      Их недоступность возвращает 500. Bonus критичен для /privilege: возвращается 503
      с телом {"message":"Bonus Service unavailable"}, как требуют приемочные тесты.
    * В ответах чтения билетов недоступные fromAirport, toAirport и date равны строке "Unavailable".
      ticketUid, flightNumber, price и status сохраняются из Ticket Service.
      В /me недоступный Bonus представлен как privilege={}, без выдуманного баланса или статуса.
    * Изменяющие вызовы и фоновые повторы бонусного возврата не блокируются Circuit Breaker чтений.

    Решения, уточняющие неоднозначности шаблона:
    * page нумеруется с 1; page=0 считается ошибкой валидации.
    * Денежные суммы и бонусы — целые неотрицательные числа. Начисление — floor(price / 10).
    * Новый бонусный счет автоматически создается с balance=0, status=BRONZE.
      Переходы между уровнями привилегий не определены заданием и не выполняются автоматически.
    * price в запросе покупки должен совпадать с актуальной ценой Flight Service.
    * price в ответе — полная цена рейса до применения бонусов;
      paidByMoney + paidByBonuses = price.
    * При доступном Flight поле date рейса имеет формат YYYY-MM-DD HH:mm, как в примерах задания;
      для тестового рейса используется Europe/Moscow. Время бонусных операций — RFC 3339 в UTC.
    * balanceDiff — неотрицательная величина операции; направление задает operationType.
    * Возврат сначала устанавливает CANCELED в Ticket, затем отменяет бонусную операцию.
      При временной недоступности Bonus Gateway подтверждает постановку задания в очередь
      и возвращает 204. Баланс исправляется фоновым HTTP-вызовом после восстановления Bonus;
      интервал повторов — 10 секунд, временные ошибки не ограничивают срок жизни задания.
    * Повторная отмена своего билета возвращает 204 без повторного изменения бонусов
      и обеспечивает завершение ранее отложенной операции.
    * Несуществующий и чужой билет одинаково возвращают 404.
    * Возвращенные билеты сохраняются и включаются в список со статусом CANCELED.

    Публичный API основан на исходном OpenAPI и Postman-коллекции v1.
    Схема описывает целевой контракт ЛР №3. Внутренние маршруты являются проектным решением.
servers:
- url: http://localhost:8080
  description: Gateway — публичный API
paths:
  /api/v1/flights:
    get:
      summary: Получить список рейсов
      tags:
      - Gateway API
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Список рейсов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '4XX':
          $ref: '#/components/responses/UpstreamRejected'
        '500':
          description: Недоступен критичный источник (Flight) или произошла внутренняя ошибка Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                flightUnavailable:
                  value:
                    message: Flight Service unavailable
                internalError:
                  value:
                    message: Internal server error
      operationId: listFlights
      description: |-
        Стабильная сортировка по id рейса. За пределами списка возвращается 200 с пустым items.
        Параметры page и size по умолчанию равны 1 и 10.
        Flight Service — критичный источник. При его недоступности или открытой цепи возвращается 500;
        пустой список не используется как fallback недоступного источника.
  /api/v1/tickets:
    get:
      summary: Информация по всем билетам пользователя
      tags:
      - Gateway API
      parameters:
      - $ref: '#/components/parameters/UserName'
      responses:
        '200':
          description: Информация по всем билетам
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TicketResponse'
              examples:
                complete:
                  summary: Все источники доступны
                  value:
                  - ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                    flightNumber: AFL031
                    fromAirport: Санкт-Петербург Пулково
                    toAirport: Москва Шереметьево
                    date: 2021-10-08 20:00
                    price: 1500
                    status: PAID
                flightUnavailable:
                  summary: Flight недоступен; данные билета сохранены
                  value:
                  - ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                    flightNumber: AFL031
                    fromAirport: Unavailable
                    toAirport: Unavailable
                    date: Unavailable
                    price: 1500
                    status: PAID
        '400':
          $ref: '#/components/responses/BadRequest'
        '4XX':
          $ref: '#/components/responses/UpstreamRejected'
        '500':
          description: Недоступен критичный источник (Ticket) или произошла внутренняя ошибка Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticketUnavailable:
                  value:
                    message: Ticket Service unavailable
                internalError:
                  value:
                    message: Internal server error
      operationId: listUserTickets
      description: |-
        Только билеты пользователя, включая CANCELED. При отсутствии билетов возвращается пустой массив.
        Ticket Service — критичный источник: при его недоступности или открытой цепи возвращается 500.
        Flight Service — некритичный источник: при его недоступности или открытой цепи возвращается 200
        со всеми доступными билетами; fromAirport, toAirport и date для недоступных рейсов равны "Unavailable".
        Доступные сведения о других рейсах сохраняются. Отказ Flight не заменяет список билетов пустым массивом.
    post:
      summary: Покупка билета
      tags:
      - Gateway API
      parameters:
      - $ref: '#/components/parameters/UserName'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TicketPurchaseRequest'
        required: true
      responses:
        '200':
          description: Информация о купленном билете
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketPurchaseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '4XX':
          $ref: '#/components/responses/UpstreamRejected'
        '503':
          $ref: '#/components/responses/BonusServiceUnavailable'
        '500':
          description: Недоступен критичный источник (Flight, Ticket) или произошла внутренняя ошибка Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                flightUnavailable:
                  value:
                    message: Flight Service unavailable
                ticketUnavailable:
                  value:
                    message: Ticket Service unavailable
                internalError:
                  value:
                    message: Internal server error
      operationId: purchaseTicket
      description: |-
        Gateway проверяет существование рейса и совпадение цены; отсутствие рейса или неверная цена возвращают 400.
        Создается билет PAID. При paidFromBalance=true списывается min(balance, price),
        paidByMoney=price-paidByBonuses, новые бонусы не начисляются.
        При false paidByMoney=price, paidByBonuses=0, начисляется floor(price/10).
        Ответ содержит полную цену и бонусный баланс после операции.
        Публичный POST не идемпотентен: новый запрос может создать новый билет.
        Gateway генерирует один ticketUid и использует его для внутренних операций одной покупки.
        При недоступности Flight покупка завершается ошибкой до создания билета.
        При недоступности Ticket покупка завершается ошибкой до бонусной операции.
        При техническом сбое Bonus Gateway откатывает результат создания билета и возвращает
        503 с телом {"message":"Bonus Service unavailable"}.
        Если ответ Bonus потерян, Gateway должен согласовать и бонусную операцию:
        отсутствие ответа не доказывает отсутствие изменений. Компенсации используют тот же ticketUid.
        Ошибка покупки не должна оставлять действующий оплаченный билет или несогласованное изменение бонусов.
        Открытый Circuit Breaker чтений не заменяет покупку успешным ответом и не запрещает компенсацию.
  /api/v1/tickets/{ticketUid}:
    get:
      summary: Информация по конкретному билету
      tags:
      - Gateway API
      parameters:
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/TicketUid'
      responses:
        '200':
          description: Информация по конкретному билету
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TicketResponse'
              examples:
                complete:
                  summary: Все источники доступны
                  value:
                    ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                    flightNumber: AFL031
                    fromAirport: Санкт-Петербург Пулково
                    toAirport: Москва Шереметьево
                    date: 2021-10-08 20:00
                    price: 1500
                    status: PAID
                flightUnavailable:
                  summary: Flight недоступен; данные билета сохранены
                  value:
                    ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                    flightNumber: AFL031
                    fromAirport: Unavailable
                    toAirport: Unavailable
                    date: Unavailable
                    price: 1500
                    status: PAID
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '4XX':
          $ref: '#/components/responses/UpstreamRejected'
        '500':
          description: Недоступен критичный источник (Ticket) или произошла внутренняя ошибка Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticketUnavailable:
                  value:
                    message: Ticket Service unavailable
                internalError:
                  value:
                    message: Internal server error
      operationId: getUserTicket
      description: |-
        Проверяется владелец билета. Чужой или отсутствующий билет возвращает 404.
        Ticket Service — критичный источник: при его недоступности или открытой цепи возвращается 500.
        Flight Service — некритичный источник: при его недоступности или открытой цепи возвращается 200
        с сохраненными ticketUid, flightNumber, price и status; fromAirport, toAirport и date равны "Unavailable".
    delete:
      summary: Возврат билета
      tags:
      - Gateway API
      parameters:
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/TicketUid'
      responses:
        '204':
          description: |-
            Билет имеет статус CANCELED. Бонусная операция завершена либо надежно поставлена в очередь.
            Тело ответа отсутствует. Исправление бонусного баланса может завершиться после ответа.
        '404':
          $ref: '#/components/responses/NotFound'
        '400':
          $ref: '#/components/responses/BadRequest'
        '4XX':
          $ref: '#/components/responses/UpstreamRejected'
        '503':
          $ref: '#/components/responses/RefundQueueUnavailable'
        '500':
          description: Недоступен критичный источник (Ticket) или произошла внутренняя ошибка Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticketUnavailable:
                  value:
                    message: Ticket Service unavailable
                internalError:
                  value:
                    message: Internal server error
      operationId: cancelUserTicket
      description: |-
        Сначала проверить владельца и установить статус CANCELED в Ticket Service.
        Если чтение или изменение Ticket недоступно, вернуть 500: успешный возврат не подтверждается.
        Затем вернуть ранее списанные бонусы либо снять начисленные, не опуская баланс ниже 0.
        При временной недоступности Bonus (включая HTTP 5xx и таймаут) Gateway ставит бонусный возврат
        в очередь и после подтверждения постановки возвращает 204 без тела.
        Обработчик Gateway повторяет HTTP-запрос к Bonus с тем же ticketUid каждые 10 секунд до успеха.
        Сообщение подтверждается после успешного выполнения; повторная доставка не меняет баланс повторно.
        Bonus Service не читает очередь и не вызывает другие сервисы.
        Повторный DELETE для своего CANCELED-билета также обеспечивает завершение бонусного возврата.
        При ошибке постановки в очередь успех не возвращается: 503 допускает повтор DELETE.
        Flight Service для возврата не требуется. Breaker чтений не блокирует бонусные записи.
  /api/v1/me:
    get:
      summary: Информация о пользователе
      tags:
      - Gateway API
      parameters:
      - $ref: '#/components/parameters/UserName'
      responses:
        '200':
          description: Информация о пользователе, включая частичный ответ при отказе Flight или Bonus
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserInfoResponse'
              examples:
                complete:
                  summary: Все источники доступны
                  value:
                    tickets:
                    - ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                      flightNumber: AFL031
                      fromAirport: Санкт-Петербург Пулково
                      toAirport: Москва Шереметьево
                      date: 2021-10-08 20:00
                      price: 1500
                      status: PAID
                    privilege:
                      balance: 150
                      status: BRONZE
                bonusUnavailable:
                  summary: Bonus недоступен
                  value:
                    tickets:
                    - ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                      flightNumber: AFL031
                      fromAirport: Санкт-Петербург Пулково
                      toAirport: Москва Шереметьево
                      date: 2021-10-08 20:00
                      price: 1500
                      status: PAID
                    privilege: {}
                flightUnavailable:
                  summary: Flight недоступен
                  value:
                    tickets:
                    - ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                      flightNumber: AFL031
                      fromAirport: Unavailable
                      toAirport: Unavailable
                      date: Unavailable
                      price: 1500
                      status: PAID
                    privilege:
                      balance: 150
                      status: BRONZE
                flightAndBonusUnavailable:
                  summary: Flight и Bonus недоступны
                  value:
                    tickets:
                    - ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
                      flightNumber: AFL031
                      fromAirport: Unavailable
                      toAirport: Unavailable
                      date: Unavailable
                      price: 1500
                      status: PAID
                    privilege: {}
        '400':
          $ref: '#/components/responses/BadRequest'
        '4XX':
          $ref: '#/components/responses/UpstreamRejected'
        '500':
          description: Недоступен критичный источник (Ticket) или произошла внутренняя ошибка Gateway
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                ticketUnavailable:
                  value:
                    message: Ticket Service unavailable
                internalError:
                  value:
                    message: Internal server error
      operationId: getUserInfo
      description: |-
        Gateway объединяет билеты из Ticket Service, сведения о рейсах из Flight Service и
        короткую информацию Bonus Service. История бонусов в privilege не включается.
        При недоступном Ticket или открытой цепи Ticket возвращается 500.
        При недоступном Flight или открытой цепи Flight сохраняются билеты,
        а fromAirport, toAirport и date недоступных рейсов равны "Unavailable".
        При недоступном Bonus или открытой цепи Bonus возвращается privilege={}.
        Если Flight и Bonus недоступны одновременно, применяются обе заглушки, статус ответа — 200.
  /api/v1/privilege:
    get:
      summary: Получить информацию о состоянии бонусного счета
      tags:
      - Gateway API
      parameters:
      - $ref: '#/components/parameters/UserName'
      responses:
        '200':
          description: Данные о бонусном счете
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '4XX':
          $ref: '#/components/responses/UpstreamRejected'
        '503':
          $ref: '#/components/responses/BonusServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
      operationId: getUserPrivilege
      description: |-
        Счет отсутствующего пользователя создается с balance=0 и status=BRONZE. История упорядочена
        по времени, затем id по возрастанию; включает покупки и обратные операции возврата.
        Bonus Service — критичный источник. При недоступности или открытой цепи возвращается
        503 с телом {"message":"Bonus Service unavailable"}. Пустой счет как fallback не возвращается.
        При отложенном возврате баланс и история отражают только уже выполненные бонусные операции;
        после фонового выполнения возврата они обновляются.
  /internal/v1/flights:
    servers:
    - url: http://localhost:8060
      description: Flight Service
    get:
      tags:
      - Flight Internal
      operationId: internalListFlights
      summary: Получить страницу рейсов
      description: Те же правила пагинации и сортировки, что у публичного списка.
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: Страница рейсов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/flights/{flightNumber}:
    servers:
    - url: http://localhost:8060
      description: Flight Service
    get:
      tags:
      - Flight Internal
      operationId: internalGetFlight
      summary: Найти рейс по номеру
      description: Для набора данных лабораторной flightNumber однозначно определяет рейс.
      parameters:
      - $ref: '#/components/parameters/FlightNumber'
      responses:
        '200':
          description: Сведения о рейсе
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlightResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/tickets:
    servers:
    - url: http://localhost:8070
      description: Ticket Service
    get:
      tags:
      - Ticket Internal
      operationId: internalListTickets
      summary: Получить билеты пользователя
      description: Фильтрация по владельцу обязательна. Включает CANCELED; стабильный порядок по id.
      parameters:
      - $ref: '#/components/parameters/UserName'
      responses:
        '200':
          description: Билеты без сведений аэропортов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InternalTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/tickets/{ticketUid}:
    servers:
    - url: http://localhost:8070
      description: Ticket Service
    get:
      tags:
      - Ticket Internal
      operationId: internalGetTicket
      summary: Получить билет пользователя
      description: Чужой и отсутствующий билет возвращают 404.
      parameters:
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/TicketUid'
      responses:
        '200':
          description: Билет
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Ticket Internal
      operationId: internalCreateTicket
      summary: Идемпотентно создать билет с UUID от Gateway
      description: Создает PAID. Одинаковые UUID, владелец и тело не создают дубликат. При изменении данных
        — 409; чужой UUID — 404. Если билет уже CANCELED, возвращается его текущее состояние, повторно
        активировать его нельзя. Проверку рейса предварительно выполняет Gateway.
      parameters:
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/TicketUid'
      responses:
        '201':
          description: Билет создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTicketResponse'
        '200':
          description: 'Повтор: существующий билет'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InternalTicketResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InternalTicketCreateRequest'
  /internal/v1/tickets/{ticketUid}/cancellation:
    servers:
    - url: http://localhost:8070
      description: Ticket Service
    put:
      tags:
      - Ticket Internal
      operationId: internalCancelTicket
      summary: Идемпотентно пометить билет CANCELED
      description: Изменяет только свою БД. Бонусы возвращает Gateway отдельным вызовом Bonus Service.
        Чужой и отсутствующий билет — 404. Gateway выполняет этот вызов до отмены бонусной операции;
        временная недоступность Bonus не препятствует сохранению CANCELED.
      parameters:
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/TicketUid'
      responses:
        '204':
          description: Статус CANCELED установлен или уже был установлен
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /internal/v1/privilege:
    servers:
    - url: http://localhost:8050
      description: Bonus Service
    get:
      tags:
      - Bonus Internal
      operationId: internalGetPrivilege
      summary: Получить или инициализировать бонусный счет
      description: Для нового пользователя создается BRONZE, balance=0, history=[]. История по datetime
        и id по возрастанию.
      parameters:
      - $ref: '#/components/parameters/UserName'
      responses:
        '200':
          description: Бонусный счет и история
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeInfoResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
  /internal/v1/privilege/operations/{ticketUid}:
    servers:
    - url: http://localhost:8050
      description: Bonus Service
    put:
      tags:
      - Bonus Internal
      operationId: internalApplyBonusOperation
      summary: Идемпотентно применить бонусную операцию покупки
      description: |-
        Ключ — ticketUid и владелец. Счет при необходимости создается.
        При true списать min(balance,price) и записать DEBIT_THE_ACCOUNT;
        при false начислить floor(price/10) и записать FILL_IN_BALANCE.
        Даже операция с величиной 0 регистрируется для идемпотентности.
        Баланс, история, ключ операции и результат сохраняются атомарно.
        Повтор с тем же телом возвращает сохраненный исходный результат, включая баланс на момент покупки,
        без повторного изменения баланса. Иное тело либо уже отмененная операция — 409;
        чужой ticketUid — 404. Параллельные операции не могут сделать баланс отрицательным.
      parameters:
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/TicketUid'
      responses:
        '201':
          description: Операция применена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonusOperationResponse'
        '200':
          description: 'Повтор: сохраненный результат исходной операции'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BonusOperationResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BonusOperationRequest'
  /internal/v1/privilege/operations/{ticketUid}/reversal:
    servers:
    - url: http://localhost:8050
      description: Bonus Service
    put:
      tags:
      - Bonus Internal
      operationId: internalReverseBonusOperation
      summary: Идемпотентно отменить бонусную операцию билета
      description: |-
        Возвращает списанные баллы (FILL_IN_BALANCE) или снимает начисленные
        в размере min(currentBalance, originallyAccrued) (DEBIT_THE_ACCOUNT).
        В историю добавляется одна обратная операция с фактической величиной изменения.
        Баланс, история и отметка отмены сохраняются атомарно.
        Повтор не изменяет баланс и возвращает его текущее состояние.
        Неизвестная или чужая операция — 404. Используется Gateway при возврате
        и для компенсации неуспешной покупки; Bonus Service не вызывает Ticket Service.
        При отложенном возврате вызывается обработчиком очереди Gateway по HTTP с исходными
        ticketUid и X-User-Name. Повторная доставка безопасна и не добавляет повторную запись истории.
        Постоянная ошибка, включая неожиданную 404, не считается успешным выполнением задания.
      parameters:
      - $ref: '#/components/parameters/UserName'
      - $ref: '#/components/parameters/TicketUid'
      responses:
        '200':
          description: Текущее состояние бонусного счета после отмены или повторного вызова
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrivilegeShortInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '500':
          $ref: '#/components/responses/InternalError'
        '404':
          $ref: '#/components/responses/NotFound'
  /manage/health:
    servers:
    - url: http://localhost:8080
      description: Gateway
    - url: http://localhost:8050
      description: Bonus Service
    - url: http://localhost:8060
      description: Flight Service
    - url: http://localhost:8070
      description: Ticket Service
    get:
      tags:
      - Management
      operationId: getHealth
      summary: Проверить доступность сервиса
      description: |-
        Одинаковый маршрут реализуется каждым сервисом. Для сервисов с БД готовность включает
        возможность обращения к собственной БД. Health Gateway не проверяет доменные сервисы:
        их временный отказ не делает сам Gateway недоступным. Заголовок пользователя не требуется.
      responses:
        '200':
          description: Сервис готов
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
components:
  schemas:
    PaginationResponse:
      type: object
      example:
        page: 1
        pageSize: 1
        totalElements: 1
        items:
        - flightNumber: AFL031
          fromAirport: Санкт-Петербург Пулково
          toAirport: Москва Шереметьево
          date: 2021-10-08 20:00
          price: 1500
      properties:
        page:
          type: integer
          minimum: 1
          description: Номер страницы, начиная с 1
        pageSize:
          type: integer
          minimum: 1
          maximum: 100
          description: Запрошенный размер страницы
        totalElements:
          type: integer
          format: int64
          minimum: 0
        items:
          type: array
          items:
            $ref: '#/components/schemas/FlightResponse'
      required:
      - page
      - pageSize
      - totalElements
      - items
    FlightResponse:
      type: object
      example:
        flightNumber: AFL031
        fromAirport: Санкт-Петербург Пулково
        toAirport: Москва Шереметьево
        date: 2021-10-08 20:00
        price: 1500
      properties:
        flightNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: AFL031
        fromAirport:
          type: string
          description: Город и аэропорт отправления
          example: Санкт-Петербург Пулково
        toAirport:
          type: string
          description: Город и аэропорт прибытия
          example: Москва Шереметьево
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$
          description: Дата вылета в Europe/Moscow, формат YYYY-MM-DD HH:mm
          example: 2021-10-08 20:00
        price:
          type: integer
          format: int32
          minimum: 0
          description: Полная стоимость рейса в рублях до применения бонусов
      required:
      - flightNumber
      - fromAirport
      - toAirport
      - date
      - price
    TicketResponse:
      type: object
      description: |-
        Сведения Ticket Service сохраняются при отказе Flight Service.
        В этом случае только fromAirport, toAirport и date заменяются строкой "Unavailable".
      example:
        ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
        flightNumber: AFL031
        fromAirport: Санкт-Петербург Пулково
        toAirport: Москва Шереметьево
        date: 2021-10-08 20:00
        price: 1500
        status: PAID
      properties:
        ticketUid:
          type: string
          format: uuid
          example: 049161bb-badd-4fa8-9d90-87c9a82b0668
        flightNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: AFL031
        fromAirport:
          type: string
          description: Город и аэропорт отправления; "Unavailable" при недоступности Flight Service
          example: Санкт-Петербург Пулково
        toAirport:
          type: string
          description: Город и аэропорт прибытия; "Unavailable" при недоступности Flight Service
          example: Москва Шереметьево
        date:
          description: Дата вылета в Europe/Moscow, YYYY-MM-DD HH:mm; "Unavailable" при недоступности Flight
          oneOf:
          - type: string
            pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$
          - type: string
            enum:
            - Unavailable
          example: 2021-10-08 20:00
        price:
          type: integer
          format: int32
          minimum: 0
          description: Полная стоимость рейса в рублях до применения бонусов
        status:
          type: string
          description: Статус билета
          enum:
          - PAID
          - CANCELED
      required:
      - ticketUid
      - flightNumber
      - fromAirport
      - toAirport
      - date
      - price
      - status
    UserInfoResponse:
      type: object
      example:
        tickets:
        - ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
          flightNumber: AFL031
          fromAirport: Санкт-Петербург Пулково
          toAirport: Москва Шереметьево
          date: 2021-10-08 20:00
          price: 1500
          status: PAID
        privilege:
          balance: 1500
          status: GOLD
      properties:
        tickets:
          type: array
          description: Информация о билетах пользователя, включая fallback сведений Flight
          items:
            $ref: '#/components/schemas/TicketResponse'
        privilege:
          $ref: '#/components/schemas/UserPrivilege'
      required:
      - tickets
      - privilege
    UserPrivilege:
      description: Данные Bonus Service; строго пустой объект при его временной недоступности
      oneOf:
      - $ref: '#/components/schemas/PrivilegeShortInfo'
      - $ref: '#/components/schemas/EmptyPrivilege'
    EmptyPrivilege:
      type: object
      description: Bonus Service недоступен; баланс и уровень привилегий неизвестны
      additionalProperties: false
      maxProperties: 0
      example: {}
    PrivilegeShortInfo:
      type: object
      properties:
        balance:
          type: integer
          format: int32
          minimum: 0
          description: Баланс бонусного счета, 1 балл = 1 рубль
        status:
          type: string
          description: Уровень бонусной программы; новый пользователь — BRONZE
          enum:
          - BRONZE
          - SILVER
          - GOLD
      required:
      - balance
      - status
      example:
        balance: 150
        status: BRONZE
    PrivilegeInfoResponse:
      type: object
      example:
        balance: 1500
        status: GOLD
        history:
        - date: '2021-10-08T19:59:19Z'
          ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
          balanceDiff: 1500
          operationType: FILL_IN_BALANCE
      properties:
        balance:
          type: integer
          format: int32
          minimum: 0
          description: Баланс бонусного счета, 1 балл = 1 рубль
        status:
          type: string
          description: Уровень бонусной программы; новый пользователь — BRONZE
          enum:
          - BRONZE
          - SILVER
          - GOLD
        history:
          type: array
          description: История изменения баланса
          items:
            $ref: '#/components/schemas/BalanceHistory'
      required:
      - balance
      - status
      - history
    BalanceHistory:
      type: object
      example:
        date: '2021-10-08T19:59:19Z'
        ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
        balanceDiff: 1500
        operationType: FILL_IN_BALANCE
      properties:
        date:
          type: string
          format: date-time
          description: Момент операции в UTC
          example: '2021-10-08T19:59:19Z'
        balanceDiff:
          type: integer
          format: int32
          minimum: 0
          description: Величина изменения; направление определяется operationType
        ticketUid:
          type: string
          format: uuid
          example: 049161bb-badd-4fa8-9d90-87c9a82b0668
        operationType:
          type: string
          enum:
          - FILL_IN_BALANCE
          - DEBIT_THE_ACCOUNT
      required:
      - date
      - balanceDiff
      - ticketUid
      - operationType
    TicketPurchaseRequest:
      type: object
      example:
        flightNumber: AFL031
        price: 1500
        paidFromBalance: true
      properties:
        flightNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: AFL031
        price:
          type: integer
          format: int32
          minimum: 0
          description: Должна совпадать с актуальной ценой рейса
        paidFromBalance:
          type: boolean
          description: Списать максимально возможное количество бонусов; начисление при true не производится
      required:
      - flightNumber
      - price
      - paidFromBalance
    TicketPurchaseResponse:
      type: object
      example:
        ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
        flightNumber: AFL031
        fromAirport: Санкт-Петербург Пулково
        toAirport: Москва Шереметьево
        date: 2021-10-08 20:00
        price: 1500
        paidByMoney: 1500
        paidByBonuses: 0
        status: PAID
        privilege:
          balance: 150
          status: BRONZE
      properties:
        ticketUid:
          type: string
          format: uuid
          example: 049161bb-badd-4fa8-9d90-87c9a82b0668
        flightNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: AFL031
        fromAirport:
          type: string
          description: Город и аэропорт отправления
          example: Санкт-Петербург Пулково
        toAirport:
          type: string
          description: Город и аэропорт прибытия
          example: Москва Шереметьево
        date:
          type: string
          pattern: ^\d{4}-\d{2}-\d{2} \d{2}:\d{2}$
          description: Дата вылета в Europe/Moscow, формат YYYY-MM-DD HH:mm
          example: 2021-10-08 20:00
        status:
          type: string
          description: Статус билета
          enum:
          - PAID
          - CANCELED
        price:
          type: integer
          format: int32
          minimum: 0
          description: Полная стоимость рейса в рублях до применения бонусов
        paidByMoney:
          type: integer
          format: int32
          minimum: 0
        paidByBonuses:
          type: integer
          format: int32
          minimum: 0
        privilege:
          $ref: '#/components/schemas/PrivilegeShortInfo'
      required:
      - ticketUid
      - flightNumber
      - fromAirport
      - toAirport
      - date
      - status
      - price
      - paidByMoney
      - paidByBonuses
      - privilege
    ErrorDescription:
      type: object
      properties:
        field:
          type: string
        error:
          type: string
      required:
      - field
      - error
    BonusServiceUnavailableError:
      type: object
      additionalProperties: false
      required:
      - message
      properties:
        message:
          type: string
          enum:
          - Bonus Service unavailable
      example:
        message: Bonus Service unavailable
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Информация об ошибке
      required:
      - message
      example:
        message: Билет не найден
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          description: Информация об ошибке
        errors:
          type: array
          description: Массив полей с описанием ошибки
          items:
            $ref: '#/components/schemas/ErrorDescription'
      required:
      - message
      - errors
      example:
        message: Ошибка валидации данных
        errors:
        - field: price
          error: Цена должна быть неотрицательным целым числом
    HealthResponse:
      type: object
      required:
      - status
      properties:
        status:
          type: string
          enum:
          - UP
      example:
        status: UP
    InternalTicketResponse:
      type: object
      required:
      - ticketUid
      - username
      - flightNumber
      - price
      - status
      properties:
        ticketUid:
          type: string
          format: uuid
          example: 049161bb-badd-4fa8-9d90-87c9a82b0668
        username:
          type: string
          minLength: 1
          maxLength: 80
        flightNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: AFL031
        price:
          type: integer
          format: int32
          minimum: 0
        status:
          type: string
          enum:
          - PAID
          - CANCELED
    InternalTicketCreateRequest:
      type: object
      required:
      - flightNumber
      - price
      properties:
        flightNumber:
          type: string
          minLength: 1
          maxLength: 20
          example: AFL031
        price:
          type: integer
          format: int32
          minimum: 0
    BonusOperationRequest:
      type: object
      required:
      - price
      - paidFromBalance
      properties:
        price:
          type: integer
          format: int32
          minimum: 0
          description: Полная цена билета, проверенная Gateway
        paidFromBalance:
          type: boolean
    BonusOperationResponse:
      type: object
      required:
      - ticketUid
      - price
      - paidByMoney
      - paidByBonuses
      - privilege
      properties:
        ticketUid:
          type: string
          format: uuid
          example: 049161bb-badd-4fa8-9d90-87c9a82b0668
        price:
          type: integer
          format: int32
          minimum: 0
        paidByMoney:
          type: integer
          format: int32
          minimum: 0
        paidByBonuses:
          type: integer
          format: int32
          minimum: 0
        privilege:
          $ref: '#/components/schemas/PrivilegeShortInfo'
      example:
        ticketUid: 049161bb-badd-4fa8-9d90-87c9a82b0668
        price: 1500
        paidByMoney: 1000
        paidByBonuses: 500
        privilege:
          balance: 0
          status: BRONZE
  parameters:
    UserName:
      name: X-User-Name
      in: header
      required: true
      description: Имя пользователя. Пустая строка и строка только из пробелов недопустимы.
      schema:
        type: string
        minLength: 1
        maxLength: 80
        pattern: .*\S.*
      example: Test Max
    TicketUid:
      name: ticketUid
      in: path
      required: true
      description: UUID билета, также ключ идемпотентности внутренних операций
      schema:
        type: string
        format: uuid
        example: 049161bb-badd-4fa8-9d90-87c9a82b0668
    FlightNumber:
      name: flightNumber
      in: path
      required: true
      schema:
        type: string
        minLength: 1
        maxLength: 20
        example: AFL031
    Page:
      name: page
      in: query
      required: false
      description: Номер страницы, начиная с 1
      schema:
        type: integer
        minimum: 1
        default: 1
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
  responses:
    UpstreamRejected:
      description: |-
        Бизнес-ошибка зависимого сервиса передается с исходным кодом 4xx и не подменяется fallback.
        Для 400 возвращается ValidationErrorResponse; для 404 и других 4xx — ErrorResponse.
        Технические подробности ответа зависимого сервиса клиенту не раскрываются.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    BonusServiceUnavailable:
      description: |-
        Bonus Service недоступен или вернул технически некорректный ответ.
        Для чтения также применяется при открытом Circuit Breaker Bonus.
        Статус 503 и точное тело ответа соответствуют приемочным тестам ЛР №3.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/BonusServiceUnavailableError'
          example:
            message: Bonus Service unavailable
    RefundQueueUnavailable:
      description: |-
        Постановка бонусного возврата в очередь не подтверждена. Билет уже может иметь статус CANCELED;
        бонусный возврат не гарантирован. Повторить DELETE с тем же ticketUid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            message: Refund queue unavailable
    BadRequest:
      description: Неверный заголовок, UUID, параметры, JSON или бизнес-валидация
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    NotFound:
      description: Ресурс не найден; чужой билет также возвращает 404
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: 'Конфликт: ключ операции уже использован с другими данными или операция уже отменена'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Зависимый сервис или собственная БД недоступны. Повтор допустим для идемпотентных внутренних
        операций.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Внутренняя ошибка сервиса
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
tags:
- name: Gateway API
  description: Публичные маршруты клиента
- name: Flight Internal
  description: Внутренние маршруты Flight Service, вызываемые Gateway
- name: Ticket Internal
  description: Внутренние маршруты Ticket Service, вызываемые Gateway
- name: Bonus Internal
  description: Внутренние маршруты Bonus Service, вызываемые Gateway
- name: Management
  description: Проверка доступности каждого сервиса
