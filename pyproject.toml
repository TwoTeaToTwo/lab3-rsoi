[project]
name = "flight-booking"
version = "0.1.0"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "sqlalchemy>=2.0.54",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["services/bonus-service", "services/flight-service", "services/ticket-service", "services/gateway"]

[dependency-groups]
dev = [
    "httpx>=0.28,<0.29",
    "mypy>=1.15,<3",
    "pytest>=8.3,<10",
    "pytest-asyncio>=0.25,<2",
    "pytest-cov>=6,<8",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
testpaths = ["services/bonus-service/tests", "services/flight-service/tests", "services/ticket-service/tests", "services/gateway/tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra"

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = [
    "services/bonus-service/src", "services/bonus-service/tests",
    "services/bonus-service/migrations", "services/bonus-service/docker",
    "services/flight-service/src", "services/flight-service/tests",
    "services/flight-service/migrations/versions",
    "services/ticket-service/src", "services/ticket-service/tests",
    "services/ticket-service/migrations", "services/ticket-service/docker",
    "services/gateway/src", "services/gateway/tests",
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.coverage.run]
source = ["bonus_service", "flight_service", "ticket_service", "gateway"]
branch = true

[tool.coverage.report]
show_missing = true
