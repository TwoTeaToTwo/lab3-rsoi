name: GitHub Classroom Workflow
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read
  actions: read
  checks: write

jobs:
  build:
    name: Autograding
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      VARIANT: v1
      SERVICE_NAME: bonus-service
      PORT_NUMBER: "8050"
      GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up uv and Python
        uses: astral-sh/setup-uv@v6
        with:
          version: "0.12.3"
          python-version: "3.13.15"
          enable-cache: true

      - name: Install dependencies
        timeout-minutes: 5
        run: |
          uv python install
          uv sync --frozen --all-packages

      - name: Run unit tests
        timeout-minutes: 5
        run: |
          uv run --frozen --all-packages pytest \
            --ignore=services/bonus-service/tests/test_postgres.py \
            --ignore=services/ticket-service/tests/ticket_tests/test_postgres.py \
            --ignore=services/flight-service/tests/flight_tests/test_postgres.py \
            --ignore=services/gateway/tests/gateway_tests/test_rabbitmq.py

      - name: Check types and formatting
        timeout-minutes: 5
        run: |
          uv run --frozen --all-packages mypy
          uv run --frozen --all-packages mypy services/flight-service/src services/flight-service/migrations services/flight-service/docker
          uv run --frozen --all-packages ruff check services
          uv run --frozen --all-packages ruff format --check services

      - uses: docker/setup-buildx-action@v3

      - name: Build images
        timeout-minutes: 10
        run: docker compose build

      - name: Run containers
        timeout-minutes: 5
        run: docker compose up -d --wait --wait-timeout 180

      - name: Wait for HTTP services
        timeout-minutes: 3
        run: ./scripts/wait-script.sh
        env:
          WAIT_PORTS: "8080,8070,8060,8050"

      - name: Run PostgreSQL and RabbitMQ integration tests
        timeout-minutes: 5
        run: |
          uv run --frozen --all-packages pytest \
            services/bonus-service/tests/test_postgres.py \
            services/ticket-service/tests/ticket_tests/test_postgres.py \
            services/flight-service/tests/flight_tests/test_postgres.py \
            services/gateway/tests/gateway_tests/test_rabbitmq.py
        env:
          BONUS_TEST_DATABASE_URL: postgresql+asyncpg://bonus:test@localhost:5432/bonus
          TICKET_TEST_DATABASE_URL: postgresql+asyncpg://ticket:test@localhost:5432/ticket
          FLIGHT_TEST_DATABASE_URL: postgresql+asyncpg://flight:test@localhost:5432/flight
          GATEWAY_TEST_RABBITMQ_URL: amqp://gateway:gateway@localhost:5672/

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Newman
        timeout-minutes: 5
        run: npm install --global newman@6.2.1

      - name: Run API and fault tolerance tests
        timeout-minutes: 10
        run: ./scripts/test-script.sh

      - name: Autograding
        if: github.event_name == 'push'
        uses: education/autograding@v1
        id: autograder
        continue-on-error: true

      - name: Github auto grader mark
        if: >-
          github.event_name == 'push' &&
          env.GOOGLE_API_KEY != '' &&
          steps.autograder.outcome == 'success'
        continue-on-error: true
        uses: Romanow/google-sheet-autograder-marker@v1.0
        with:
          google_token: ${{ env.GOOGLE_API_KEY }}
          sheet_id: "1xkgjUX6Qmk7rdJG-QPOToav-HWWtthJjnShIKnw3oIY"
          homework_number: 3
          user_column: 'D'
          column_offset: 'F'
          mark: "'+"

      - name: Save container diagnostics
        if: failure()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          mkdir -p "$RUNNER_TEMP/lab3-ci-logs"
          docker compose ps --all > "$RUNNER_TEMP/lab3-ci-logs/compose-status.txt"
          docker compose logs --no-color > "$RUNNER_TEMP/lab3-ci-logs/compose.log" 2>&1

      - name: Upload container diagnostics
        if: failure()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: lab3-container-logs
          path: ${{ runner.temp }}/lab3-ci-logs/
          retention-days: 7

      - name: Stop containers
        if: always()
        continue-on-error: true
        timeout-minutes: 2
        run: docker compose down -v --remove-orphans
