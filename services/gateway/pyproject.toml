[project]
name = "gateway"
version = "0.1.0"
description = "Flight Booking HTTP Gateway"
requires-python = ">=3.13.15,<3.14"
dependencies = [
    "aio-pika>=9.5,<10",
    "fastapi>=0.115,<1",
    "pydantic>=2.10,<3",
    "pydantic-settings>=2.7,<3",
    "httpx>=0.28,<0.29",
    "uvicorn>=0.34,<1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gateway"]
